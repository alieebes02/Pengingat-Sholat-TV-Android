<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengingat Shalat — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1B2B; --bg2:#102738; --card:#142F43; --card-active:#1C3B52;
  --accent:#D9A441; --accent-soft:#8A6A2C;
  --text:#F2EDE4; --muted:#8FA8B8;
  color-scheme: dark;
}
:root[data-theme="senja"]{
  --bg:#231225; --bg2:#301A32; --card:#3A1F3E; --card-active:#4C2A4F;
  --accent:#E8886B; --accent-soft:#8F4F3C; --text:#F7EEE8; --muted:#C19BAE;
}
:root[data-theme="fajar"]{
  --bg:#0E2230; --bg2:#15344A; --card:#1C4260; --card-active:#245175;
  --accent:#8FD8C8; --accent-soft:#4D8B7C; --text:#EAF6F2; --muted:#9FC2CE;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg) 60%);
  color:var(--text); font-family:'Manrope',sans-serif;
  padding:4vh 5vw; padding-top:calc(4vh + env(safe-area-inset-top,0px));
  padding-bottom:calc(4vh + env(safe-area-inset-bottom,0px));
  display:flex; flex-direction:column; min-height:100%; gap:3.5vh;
}
.topbar{display:flex; justify-content:space-between; align-items:flex-start; color:var(--muted); font-size:1.3vw; min-font-size:16px;}
.topbar .date{font-size:1.4vw;}
.topbar .clock{font-family:'Manrope',sans-serif; font-weight:800; font-size:2.2vw; color:var(--text); letter-spacing:0.02em;}
.hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:1vh;}
.hero .label{color:var(--muted); font-size:1.4vw; letter-spacing:0.04em;}
.hero .name{font-family:'Spectral',serif; font-weight:600; font-size:5.2vw; color:var(--accent); line-height:1.05;}
.hero .countdown{font-family:'Manrope',sans-serif; font-weight:800; font-size:7vw; letter-spacing:0.03em; font-variant-numeric:tabular-nums;}
.hero .sub{color:var(--muted); font-size:1.3vw; margin-top:0.5vh;}
.row{display:flex; gap:1.4vw; justify-content:center;}
.pcard{
  background:var(--card); border-radius:18px; padding:2.2vh 1.6vw; min-width:11vw;
  text-align:center; border:2px solid transparent; transition:transform .25s, border-color .25s, background .25s;
}
.pcard .pname{font-size:1.25vw; color:var(--muted); margin-bottom:0.6vh;}
.pcard .ptime{font-size:2vw; font-weight:800; font-variant-numeric:tabular-nums;}
.pcard.active{background:var(--card-active); border-color:var(--accent); transform:translateY(-6px);}
.pcard.active .pname{color:var(--accent);}
.controls{display:flex; gap:1.4vw; flex-wrap:wrap; justify-content:center;}
button, select{
  font-family:'Manrope',sans-serif; font-size:1.15vw; color:var(--text);
  background:var(--card); border:2px solid transparent; border-radius:12px;
  padding:1.3vh 1.4vw; cursor:pointer; appearance:none;
}
button:focus, select:focus, input:focus, .pcard:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.status{font-size:1.05vw; color:var(--muted); text-align:center;}
.status.ok{color:var(--accent);}
@media (max-width:700px){
  .topbar{font-size:3.2vw;} .topbar .clock{font-size:5vw;}
  .hero .name{font-size:8vw;} .hero .countdown{font-size:11vw;} .hero .label,.hero .sub{font-size:3vw;}
  .row{flex-wrap:wrap;} .pcard{min-width:26vw;} .pcard .pname{font-size:3vw;} .pcard .ptime{font-size:4.5vw;}
  button,select{font-size:3vw;}
  .status{font-size:3vw;}
}
</style>
</head>
<body>
  <div class="topbar">
    <div><div class="date" id="tgl">—</div></div>
    <div class="clock" id="jam">--:--:--</div>
  </div>

  <div class="hero">
    <div class="label">Waktu shalat berikutnya</div>
    <div class="name" id="nextName">Memuat…</div>
    <div class="countdown" id="countdown">--:--:--</div>
    <div class="sub" id="locInfo">Lokasi belum aktif</div>
  </div>

  <div class="row" id="prayerRow"></div>

  <div class="controls">
    <button id="btnLoc">📍 Aktifkan Lokasi</button>
    <select id="selMetode">
      <option value="kemenag">Metode: Kemenag RI</option>
      <option value="mwl">Metode: MWL</option>
      <option value="isna">Metode: ISNA</option>
    </select>
    <select id="selTema">
      <option value="malam">Tema: Malam</option>
      <option value="senja">Tema: Senja</option>
      <option value="fajar">Tema: Fajar</option>
    </select>
  </div>
  <div class="controls">
    <label style="color:var(--muted); font-size:1.1vw; display:flex; align-items:center; gap:0.6vw;">
      🔊 Volume
      <input type="range" id="volSlider" min="0" max="100" value="80" style="width:12vw;">
    </label>
  </div>

  <div class="controls" style="flex-direction:column; gap:0.8vh;">
    <div class="status" style="color:var(--accent); font-weight:800;">Suara Subuh (biasanya berbeda dari waktu lain)</div>
    <div class="controls">
      <select id="selNada-subuh">
        <option value="lembut">Nada: Lembut</option>
        <option value="klasik">Nada: Klasik</option>
        <option value="modern">Nada: Modern</option>
        <option value="custom">Nada: Audio Saya</option>
      </select>
      <button id="btnTest-subuh">🔔 Tes</button>
      <button id="btnUpload-subuh">📁 Unggah</button>
      <button id="btnHapus-subuh" style="display:none;">🗑️ Hapus</button>
      <input type="file" id="fileAdzan-subuh" accept="audio/*" style="display:none;">
    </div>
    <div class="status" id="fileNameLabel-subuh"></div>
  </div>

  <div class="controls" style="flex-direction:column; gap:0.8vh;">
    <div class="status" style="color:var(--accent); font-weight:800;">Suara Dzuhur / Ashar / Maghrib / Isya</div>
    <div class="controls">
      <select id="selNada-lainnya">
        <option value="lembut">Nada: Lembut</option>
        <option value="klasik">Nada: Klasik</option>
        <option value="modern">Nada: Modern</option>
        <option value="custom">Nada: Audio Saya</option>
      </select>
      <button id="btnTest-lainnya">🔔 Tes</button>
      <button id="btnUpload-lainnya">📁 Unggah</button>
      <button id="btnHapus-lainnya" style="display:none;">🗑️ Hapus</button>
      <input type="file" id="fileAdzan-lainnya" accept="audio/*" style="display:none;">
    </div>
    <div class="status" id="fileNameLabel-lainnya"></div>
  </div>

  <div class="status" id="statusMsg">Tanpa login, tanpa registrasi — seluruh data tersimpan hanya di perangkat ini.</div>

<script>
// ---------- Preferensi lokal (tanpa akun) ----------
function loadPref(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function savePref(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

const root=document.documentElement;
const selTema=document.getElementById('selTema');
const selMetode=document.getElementById('selMetode');
selTema.value=loadPref('tema','malam');
selMetode.value=loadPref('metode','kemenag');
root.setAttribute('data-theme', selTema.value);

selTema.addEventListener('change',()=>{ root.setAttribute('data-theme',selTema.value); savePref('tema',selTema.value); });
selMetode.addEventListener('change',()=>{ savePref('metode',selMetode.value); hitungDanTampilkan(); syncNative(); });

function syncNative(){
  if(typeof Native==='undefined') return;
  try{
    const nadaSubuh=document.getElementById('selNada-subuh') ? document.getElementById('selNada-subuh').value : 'lembut';
    const nadaLainnya=document.getElementById('selNada-lainnya') ? document.getElementById('selNada-lainnya').value : 'lembut';
    const vol=document.getElementById('volSlider') ? parseInt(document.getElementById('volSlider').value,10)||80 : 80;
    Native.simpanPengaturan(selMetode.value, nadaSubuh, nadaLainnya, vol);
    Native.jadwalkanUlang();
  }catch(e){}
}

// ---------- Jam & tanggal ----------
function tickClock(){
  const now=new Date();
  document.getElementById('jam').textContent=now.toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('tgl').textContent=now.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
}
setInterval(tickClock,1000); tickClock();

// ---------- Perhitungan waktu shalat (metode astronomis, tanpa koneksi internet) ----------
const METHODS={
  kemenag:{fajr:20, isha:18},
  mwl:{fajr:18, isha:17},
  isna:{fajr:15, isha:15}
};
const dtr=d=>d*Math.PI/180, rtd=r=>r*180/Math.PI;
function fixAngle(a){ a=a-360*Math.floor(a/360); return a<0?a+360:a; }
function fixHour(h){ h=h-24*Math.floor(h/24); return h<0?h+24:h; }

function julian(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D=jd-2451545.0;
  const g=fixAngle(357.529+0.98560028*D);
  const q=fixAngle(280.459+0.98564736*D);
  const L=fixAngle(q+1.915*Math.sin(dtr(g))+0.020*Math.sin(dtr(2*g)));
  const e=23.439-0.00000036*D;
  const dec=rtd(Math.asin(Math.sin(dtr(e))*Math.sin(dtr(L))));
  let RA=rtd(Math.atan2(Math.cos(dtr(e))*Math.sin(dtr(L)),Math.cos(dtr(L))))/15;
  RA=fixHour(RA);
  const eqt=q/15-RA;
  return {dec:dec, eqt:eqt};
}
function sunAngleTime(jd, angle, lat, lng, tz, dir){
  const {dec,eqt}=sunPosition(jd+ (12-0)/24 ); // noon approx first pass
  const noon=12-lng/15-eqt+tz;
  const num=-Math.sin(dtr(angle))-Math.sin(dtr(lat))*Math.sin(dtr(dec));
  const den=Math.cos(dtr(lat))*Math.cos(dtr(dec));
  const ratio=num/den;
  if(Math.abs(ratio)>1) return null;
  const t=rtd(Math.acos(ratio))/15;
  return noon + (dir==='ccw'?-t:t);
}
function asrTime(jd, lat, lng, tz, factor){
  const {dec,eqt}=sunPosition(jd+0.5);
  const noon=12-lng/15-eqt+tz;
  const a=rtd(Math.atan(1/(factor+Math.tan(dtr(Math.abs(lat-dec))))));
  const num=Math.sin(dtr(a))-Math.sin(dtr(lat))*Math.sin(dtr(dec));
  const den=Math.cos(dtr(lat))*Math.cos(dtr(dec));
  const t=rtd(Math.acos(num/den))/15;
  return noon+t;
}
function toHHMM(t){
  if(t===null||isNaN(t)) return '--:--';
  t=fixHour(t);
  const h=Math.floor(t); const m=Math.round((t-h)*60);
  const hh=(m===60? h+1:h), mm=(m===60?0:m);
  return String(fixHour(hh)).padStart(2,'0').slice(0,2)+':'+String(mm).padStart(2,'0');
}

let coords=null;
let timezoneOffset=-new Date().getTimezoneOffset()/60;

function hitungWaktu(lat,lng,methodKey){
  const m=METHODS[methodKey]||METHODS.kemenag;
  const now=new Date();
  const jd=julian(now.getFullYear(), now.getMonth()+1, now.getDate());
  const fajr=sunAngleTime(jd, m.fajr, lat, lng, timezoneOffset, 'ccw');
  const sunrise=sunAngleTime(jd, 0.833, lat, lng, timezoneOffset, 'ccw');
  const {eqt}=sunPosition(jd+0.5);
  const dzuhur=12-lng/15-eqt+timezoneOffset+ (2/60); // +2 menit ihtiyat
  const ashar=asrTime(jd, lat, lng, timezoneOffset, 1);
  const maghrib=sunAngleTime(jd, 0.833, lat, lng, timezoneOffset, 'cw');
  const isya=sunAngleTime(jd, m.isha, lat, lng, timezoneOffset, 'cw');
  return [
    {key:'subuh', nama:'Subuh', t:fajr},
    {key:'dzuhur', nama:'Dzuhur', t:dzuhur},
    {key:'ashar', nama:'Ashar', t:ashar},
    {key:'maghrib', nama:'Maghrib', t:maghrib},
    {key:'isya', nama:'Isya', t:isya},
  ];
}

let jadwalCache=[];
function hitungDanTampilkan(){
  if(!coords) return;
  jadwalCache=hitungWaktu(coords.lat, coords.lng, selMetode.value);
  renderCards();
  updateCountdown();
}

function renderCards(){
  const row=document.getElementById('prayerRow');
  row.innerHTML='';
  jadwalCache.forEach(p=>{
    const div=document.createElement('div');
    div.className='pcard'; div.tabIndex=0; div.id='card-'+p.key;
    div.innerHTML='<div class="pname">'+p.nama+'</div><div class="ptime">'+toHHMM(p.t)+'</div>';
    row.appendChild(div);
  });
}

function timeToDate(t){
  const now=new Date();
  const h=Math.floor(fixHour(t)); const m=Math.round((fixHour(t)-h)*60);
  const d=new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  return d;
}

let lastNotified='';
function updateCountdown(){
  if(!jadwalCache.length) return;
  const now=new Date();
  let next=null, nextDate=null;
  for(const p of jadwalCache){
    if(p.t===null) continue;
    const d=timeToDate(p.t);
    if(d>now){ next=p; nextDate=d; break; }
  }
  if(!next){ // sudah lewat isya, ambil subuh besok
    next=jadwalCache[0];
    nextDate=timeToDate(next.t); nextDate.setDate(nextDate.getDate()+1);
  }
  document.getElementById('nextName').textContent=next.nama;
  const diff=Math.max(0, nextDate-now);
  const hh=String(Math.floor(diff/3600000)).padStart(2,'0');
  const mm=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const ss=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  document.getElementById('countdown').textContent=hh+':'+mm+':'+ss;

  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('active'));
  const el=document.getElementById('card-'+next.key);
  if(el) el.classList.add('active');

  if(diff<1000 && lastNotified!==next.key+now.toDateString()){
    lastNotified=next.key+now.toDateString();
    mainkan(next.key==='subuh' ? 'subuh' : 'lainnya');
  }
}
setInterval(updateCountdown,1000);

// ---------- Lokasi via GPS browser ----------
document.getElementById('btnLoc').addEventListener('click', aktifkanLokasi);
function aktifkanLokasi(){
  const info=document.getElementById('locInfo');
  if(!('geolocation' in navigator)){ info.textContent='Perangkat tidak mendukung lokasi otomatis.'; return; }
  info.textContent='Meminta izin lokasi…';
  navigator.geolocation.getCurrentPosition(pos=>{
    coords={lat:pos.coords.latitude, lng:pos.coords.longitude};
    savePref('lat', coords.lat); savePref('lng', coords.lng);
    info.textContent='Lokasi aktif ('+coords.lat.toFixed(2)+', '+coords.lng.toFixed(2)+')';
    info.classList.add('ok');
    hitungDanTampilkan();
    if(typeof Native!=='undefined'){ try{ Native.simpanLokasi(coords.lat, coords.lng); syncNative(); }catch(e){} }
  }, err=>{
    info.textContent='Izin lokasi ditolak/gagal. Gunakan menu remote TV untuk mengizinkan akses lokasi.';
  }, {enableHighAccuracy:false, timeout:10000});
}
// coba muat lokasi tersimpan sebelumnya
(function initLoc(){
  const lat=loadPref('lat',null), lng=loadPref('lng',null);
  if(lat && lng){
    coords={lat:parseFloat(lat), lng:parseFloat(lng)};
    document.getElementById('locInfo').textContent='Lokasi tersimpan ('+coords.lat.toFixed(2)+', '+coords.lng.toFixed(2)+')';
    document.getElementById('locInfo').classList.add('ok');
    hitungDanTampilkan();
    if(typeof Native!=='undefined'){ try{ Native.simpanLokasi(coords.lat, coords.lng); syncNative(); }catch(e){} }
  }
})();

// ---------- Volume ----------
const volSlider=document.getElementById('volSlider');
volSlider.value=loadPref('volume','80');
volSlider.addEventListener('input', ()=> savePref('volume', volSlider.value));
function getVolume(){ return (parseInt(volSlider.value,10)||80)/100; }

// ---------- Nada & audio kustom per slot (subuh / lainnya) ----------
let actx=null;
function nadaCtx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, start, dur, type){
  const ctx=nadaCtx();
  const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.type=type||'sine'; osc.frequency.value=freq;
  const vol=0.25*getVolume();
  gain.gain.setValueAtTime(0.0001, ctx.currentTime+start);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol,0.0001), ctx.currentTime+start+0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.05);
}
function mainkanBeep(jenis){
  if(jenis==='klasik'){ beep(392,0,0.4); beep(392,0.4,0.4); beep(523,0.8,0.7); }
  else if(jenis==='modern'){ beep(660,0,0.2); beep(880,0.2,0.2); beep(660,0.4,0.2); beep(880,0.6,0.5); }
  else { beep(523,0,0.6); beep(659,0.5,0.6); beep(784,1.0,0.9); }
}

const SLOTS={};
function setupSlot(slot, labelNama){
  const sel=document.getElementById('selNada-'+slot);
  const btnTest=document.getElementById('btnTest-'+slot);
  const btnUpload=document.getElementById('btnUpload-'+slot);
  const btnHapus=document.getElementById('btnHapus-'+slot);
  const fileInput=document.getElementById('fileAdzan-'+slot);
  const fileNameLabel=document.getElementById('fileNameLabel-'+slot);
  const state={ data: loadPref('customAdzan-'+slot+'-data', null), name: loadPref('customAdzan-'+slot+'-name','') };
  sel.value=loadPref('nada-'+slot,'lembut');

  function refresh(){
    if(state.data){
      fileNameLabel.textContent='🎵 '+labelNama+': '+(state.name||'audio kustom');
      btnHapus.style.display='inline-block';
    } else {
      fileNameLabel.textContent='';
      btnHapus.style.display='none';
      if(sel.value==='custom'){ sel.value='lembut'; savePref('nada-'+slot,'lembut'); }
    }
  }
  refresh();

  sel.addEventListener('change', ()=>{ savePref('nada-'+slot, sel.value); syncNative(); });
  btnUpload.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    if(f.size>3*1024*1024){
      document.getElementById('statusMsg').textContent='File terlalu besar (maks sekitar 3MB). Pilih audio yang lebih pendek.';
      return;
    }
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        savePref('customAdzan-'+slot+'-data', reader.result);
        savePref('customAdzan-'+slot+'-name', f.name);
        state.data=reader.result; state.name=f.name;
        sel.value='custom'; savePref('nada-'+slot,'custom');
        refresh();
        if(typeof Native!=='undefined' && typeof Native.simpanAudioBase64==='function'){
          try{ Native.simpanAudioBase64(slot, reader.result, f.name); }catch(e){}
        }
        document.getElementById('statusMsg').textContent='Audio '+labelNama.toLowerCase()+' berhasil diunggah dan tersimpan di perangkat ini.';
      }catch(err){
        document.getElementById('statusMsg').textContent='Gagal menyimpan audio (penyimpanan perangkat mungkin penuh). Coba file yang lebih kecil.';
      }
    };
    reader.readAsDataURL(f);
  });
  btnHapus.addEventListener('click', ()=>{
    try{ localStorage.removeItem('customAdzan-'+slot+'-data'); localStorage.removeItem('customAdzan-'+slot+'-name'); }catch(e){}
    state.data=null; state.name='';
    refresh();
    if(typeof Native!=='undefined' && typeof Native.hapusAudioNative==='function'){
      try{ Native.hapusAudioNative(slot); }catch(e){}
    }
    document.getElementById('statusMsg').textContent='Audio '+labelNama.toLowerCase()+' dihapus. Kembali ke nada bawaan.';
  });
  btnTest.addEventListener('click', ()=> mainkan(slot));
  if('Notification' in window && Notification.permission==='default'){
    btnTest.addEventListener('click', ()=>{ try{ Notification.requestPermission(); }catch(e){} }, {once:true});
  }

  SLOTS[slot]={ sel, state };
}
setupSlot('subuh','Suara Subuh');
setupSlot('lainnya','Suara Lainnya');
volSlider.addEventListener('input', syncNative);
syncNative();

function mainkan(slot){
  const { sel, state }=SLOTS[slot];
  const jenis=sel.value;
  if(jenis==='custom' && state.data){
    const audio=new Audio(state.data);
    audio.volume=getVolume();
    audio.play().catch(()=>{ document.getElementById('statusMsg').textContent='Tidak bisa memutar audio kustom otomatis di browser ini.'; });
  } else {
    mainkanBeep(jenis);
  }
  document.getElementById('statusMsg').textContent='🔔 Waktu shalat telah tiba — nada pengingat diputar.';
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Waktu Shalat', {body:'Saatnya shalat.'}); }catch(e){}
  }
}
</script>
</body>
</html>
