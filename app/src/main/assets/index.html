<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pengingat Shalat — TV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;600&family=Manrope:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1B2B; --bg2:#102738; --card:#142F43; --card-active:#1C3B52;
  --accent:#D9A441; --accent-soft:#8A6A2C; --pattern-line:rgba(217,164,65,0.08);
  --text:#F2EDE4; --muted:#8FA8B8;
  color-scheme: dark;
}
:root[data-theme="senja"]{
  --bg:#231225; --bg2:#301A32; --card:#3A1F3E; --card-active:#4C2A4F;
  --accent:#E8886B; --accent-soft:#8F4F3C; --pattern-line:rgba(232,136,107,0.08); --text:#F7EEE8; --muted:#C19BAE;
}
:root[data-theme="fajar"]{
  --bg:#0E2230; --bg2:#15344A; --card:#1C4260; --card-active:#245175;
  --accent:#8FD8C8; --accent-soft:#4D8B7C; --pattern-line:rgba(143,216,200,0.08); --text:#EAF6F2; --muted:#9FC2CE;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background-color:var(--bg);
  background-image:
    radial-gradient(ellipse at 50% -10%, var(--bg2), var(--bg) 60%),
    repeating-linear-gradient(45deg, transparent 0 38px, var(--pattern-line) 38px 40px, transparent 40px 78px),
    repeating-linear-gradient(-45deg, transparent 0 38px, var(--pattern-line) 38px 40px, transparent 40px 78px);
  color:var(--text); font-family:'Manrope',sans-serif;
  padding:5vh 5vw; padding-top:calc(5vh + env(safe-area-inset-top,0px));
  padding-bottom:calc(5vh + env(safe-area-inset-bottom,0px));
  box-sizing:border-box;
  display:flex; flex-direction:column; min-height:100%; gap:2vh;
  overflow-x:hidden;
}
.topbar{display:flex; justify-content:space-between; align-items:flex-start; color:var(--muted); font-size:1.3vw; min-font-size:16px;}
.topbar .date{font-size:1.4vw;}
.topbar .clock{font-family:'Manrope',sans-serif; font-weight:800; font-size:2.2vw; color:var(--text); letter-spacing:0.02em;}
.ornamen{display:flex; align-items:center; justify-content:center; gap:1vw; color:var(--accent); opacity:0.75; margin-bottom:0.3vh;}
.ornamen .garis{height:1px; width:5vw; background:linear-gradient(90deg, transparent, var(--accent), transparent);}
.moon-watermark{position:fixed; top:-7vw; right:-7vw; width:34vw; height:34vw; z-index:-1; opacity:0.14; pointer-events:none;}
.moon-watermark circle:first-child{fill:var(--accent);}
.moon-watermark circle:last-child{fill:var(--bg);}
.skyline{position:fixed; left:0; right:0; bottom:0; width:100%; height:20vh; z-index:-1; opacity:0.18; pointer-events:none;}
.skyline rect, .skyline path, .skyline circle{fill:var(--accent);}
.frame-border{position:fixed; inset:1.5vh 1.5vw; border:2px solid var(--accent); border-radius:6px; z-index:1; pointer-events:none; opacity:0.5;}
.frame-border::before{content:''; position:absolute; inset:6px; border:1px solid var(--accent); border-radius:4px; opacity:0.6;}
.frame-corner{position:fixed; width:4vw; height:4vw; min-width:38px; min-height:38px; z-index:2; pointer-events:none; opacity:0.8;}
.frame-corner path{fill:none; stroke:var(--accent); stroke-width:2.5;}
.frame-corner circle{fill:var(--accent);}
.frame-corner.tl{top:1.3vh; left:1.3vw;}
.frame-corner.tr{top:1.3vh; right:1.3vw; transform:rotate(90deg);}
.frame-corner.br{bottom:1.3vh; right:1.3vw; transform:rotate(180deg);}
.frame-corner.bl{bottom:1.3vh; left:1.3vw; transform:rotate(270deg);}
.hero{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:0.8vh;}
.hero .label{color:var(--muted); font-size:1.4vw; letter-spacing:0.04em;}
.hero .name{font-family:'Spectral',serif; font-weight:600; font-size:clamp(26px, 5.2vw, 8vh); color:var(--accent); line-height:1.05;}
.hero .countdown{font-family:'Manrope',sans-serif; font-weight:800; font-size:clamp(34px, 7vw, 11vh); letter-spacing:0.03em; font-variant-numeric:tabular-nums;}
.hero .sub{color:var(--muted); font-size:1.3vw; margin-top:0;}
.hero #labelMetode{font-size:1.05vw; margin-top:0.2vh;}
.row{display:flex; gap:1.4vw; justify-content:center;}
.pcard{
  position:relative; background:var(--card); border-radius:4px 4px 18px 18px; padding:2.6vh 1.6vw 2.2vh; min-width:11vw;
  text-align:center; border:2px solid transparent; transition:transform .25s, border-color .25s, background .25s;
}
.pcard::before{
  content:''; position:absolute; top:-9px; left:50%; transform:translateX(-50%);
  width:60%; height:16px; border-radius:50% 50% 0 0; background:var(--card);
  border:2px solid transparent; transition:background .25s;
}
.pcard.active::before{background:var(--card-active); border-color:var(--accent);}
.pcard .pname{font-size:1.25vw; color:var(--muted); margin-bottom:0.6vh;}
.pcard .ptime{font-size:2vw; font-weight:800; font-variant-numeric:tabular-nums;}
.pcard.active{background:var(--card-active); border-color:var(--accent); transform:translateY(-6px);}
.pcard.active .pname{color:var(--accent);}
.controls{display:flex; gap:1.4vw; flex-wrap:wrap; justify-content:center;}
button, select{
  font-family:'Manrope',sans-serif; font-size:1.15vw; color:var(--text);
  background:var(--card); border:2px solid transparent; border-radius:12px;
  padding:1.3vh 1.4vw; cursor:pointer; appearance:none;
}
button:focus, select:focus, input:focus, .pcard:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 4px var(--accent-soft);}
.status{font-size:1.05vw; color:var(--muted); text-align:center;}
.status.ok{color:var(--accent);}
.gear-btn{
  position:fixed; left:4vw; bottom:4vh; z-index:20;
  width:4.5vw; height:4.5vw; min-width:52px; min-height:52px;
  border-radius:50%; background:var(--card); border:2px solid transparent;
  display:flex; align-items:center; justify-content:center; font-size:2vw;
  cursor:pointer; padding:0;
}
.settings-overlay{
  display:none; position:fixed; inset:0; background:rgba(0,0,0,0.75);
  z-index:30; align-items:center; justify-content:center; padding:4vh 4vw;
}
.settings-overlay.open{display:flex;}
.settings-panel{
  background:var(--bg2); border-radius:20px; padding:3vh 3vw; max-width:92vw; max-height:88vh;
  overflow-y:auto; display:flex; flex-direction:column; gap:2vh; width:min(900px, 92vw);
}
.settings-header{display:flex; justify-content:space-between; align-items:center; gap:2vw;}
.settings-header h2{margin:0; font-family:'Spectral',serif; font-size:1.8vw; color:var(--accent); display:flex; align-items:center; gap:0.6vw;}
.settings-panel{border-top:3px solid var(--accent);}
@media (max-width:700px){
  .topbar{font-size:3.2vw;} .topbar .clock{font-size:5vw;}
  .hero .name{font-size:8vw;} .hero .countdown{font-size:11vw;} .hero .label,.hero .sub{font-size:3vw;}
  .row{flex-wrap:wrap;} .pcard{min-width:26vw;} .pcard .pname{font-size:3vw;} .pcard .ptime{font-size:4.5vw;}
  button,select{font-size:3vw;}
  .status{font-size:3vw;}
  .gear-btn{width:14vw; height:14vw; font-size:6vw;}
  .settings-header h2{font-size:5vw;}
}
</style>
</head>

<script>
// ---------- Preferensi lokal (tanpa akun) ----------
function loadPref(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function savePref(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

const root=document.documentElement;
const selTema=document.getElementById('selTema');
const selMetode=document.getElementById('selMetode');
selTema.value=loadPref('tema','malam');
selMetode.value=loadPref('metode','kemenag');
root.setAttribute('data-theme', selTema.value);

selTema.addEventListener('change',()=>{ root.setAttribute('data-theme',selTema.value); savePref('tema',selTema.value); });
selMetode.addEventListener('change',()=>{ savePref('metode',selMetode.value); hitungDanTampilkan(); syncNative(); });

function syncNative(){
  if(typeof Native==='undefined') return;
  try{
    const nadaSubuh=document.getElementById('selNada-subuh') ? document.getElementById('selNada-subuh').value : 'lembut';
    const nadaLainnya=document.getElementById('selNada-lainnya') ? document.getElementById('selNada-lainnya').value : 'lembut';
    const vol=document.getElementById('volSlider') ? parseInt(document.getElementById('volSlider').value,10)||80 : 80;
    Native.simpanPengaturan(selMetode.value, nadaSubuh, nadaLainnya, vol);
    Native.jadwalkanUlang();
  }catch(e){}
}

// ---------- Menu pengaturan (ikon gear, fullscreen bersih) ----------
const settingsOverlay=document.getElementById('settingsOverlay');
const btnGear=document.getElementById('btnGear');
const btnTutupSettings=document.getElementById('btnTutupSettings');
btnGear.addEventListener('click', ()=>{
  settingsOverlay.classList.add('open');
  btnTutupSettings.focus();
});
btnTutupSettings.addEventListener('click', ()=>{
  settingsOverlay.classList.remove('open');
  btnGear.focus();
});
document.addEventListener('keydown', (e)=>{
  if(settingsOverlay.classList.contains('open') && (e.key==='Escape' || e.key==='Backspace' || e.key==='GoBack')){
    e.preventDefault();
    settingsOverlay.classList.remove('open');
    btnGear.focus();
  }
  if(detailOverlay.classList.contains('open') && (e.key==='Escape' || e.key==='Backspace' || e.key==='GoBack')){
    e.preventDefault();
    detailOverlay.classList.remove('open');
  }
});

// ---------- Detail waktu shalat (klik kartu jadwal) ----------
const detailOverlay=document.getElementById('detailOverlay');
const btnTutupDetail=document.getElementById('btnTutupDetail');
btnTutupDetail.addEventListener('click', ()=> detailOverlay.classList.remove('open'));

const KETERANGAN_METODE={
  kemenag:'Kementerian Agama RI',
  muhammadiyah:'HISABMU / KHGT Muhammadiyah',
  mwl:'Muslim World League (MWL)',
  isna:'Islamic Society of North America (ISNA)'
};

function tampilkanDetailShalat(key){
  const item=jadwalCache.find(p=>p.key===key);
  if(!item) return;
  const metode=selMetode.value;
  const namaMetode=KETERANGAN_METODE[metode] || metode;
  const m=METHODS[metode] || METHODS.kemenag;
  let dasar='';
  if(key==='subuh'){
    dasar='Dimulai saat posisi matahari berada pada sudut -'+m.fajr+'° di bawah ufuk timur (terbitnya fajar shadiq), menurut kriteria '+namaMetode+'.';
  } else if(key==='dzuhur'){
    dasar='Dimulai saat matahari tepat melewati titik kulminasi/meridian (tergelincir ke barat), ditambah 2 menit waktu ihtiyat (kehati-hatian). Waktu ini sama untuk semua metode.';
  } else if(key==='ashar'){
    dasar='Dimulai saat panjang bayangan suatu benda sama dengan panjang bendanya ditambah panjang bayangan saat tengah hari (kriteria mazhab Syafi\'i). Tidak dipengaruhi oleh pilihan metode di atas.';
  } else if(key==='maghrib'){
    dasar='Dimulai saat matahari terbenam penuh di ufuk barat, pada sudut -0.833° (memperhitungkan refraksi atmosfer dan jari-jari piringan matahari). Waktu ini sama untuk semua metode.';
  } else if(key==='isya'){
    dasar='Dimulai saat posisi matahari berada pada sudut -'+m.isha+'° di bawah ufuk barat (hilangnya cahaya senja merah), menurut kriteria '+namaMetode+'.';
  }
  document.getElementById('detailTitle').textContent=item.nama;
  document.getElementById('detailJam').textContent=toHHMM(item.t);
  document.getElementById('detailMetode').textContent='Metode aktif: '+namaMetode;
  document.getElementById('detailDasar').textContent=dasar;
  detailOverlay.classList.add('open');
  btnTutupDetail.focus();
}

function tampilkanDetailIslami(label, targetJdn, statusText, penjelasan){
  const g=jdnToGregorian(targetJdn);
  const h=jdnToIslamic(targetJdn);
  document.getElementById('detailTitle').textContent=label;
  document.getElementById('detailJam').textContent=g.day+' '+BULAN_MASEHI[g.month-1]+' '+g.year;
  document.getElementById('detailMetode').textContent=h.day+' '+BULAN_HIJRIAH[h.month-1]+' '+h.year+' H — '+statusText;
  document.getElementById('detailDasar').textContent=penjelasan;
  detailOverlay.classList.add('open');
  btnTutupDetail.focus();
}

// ---------- Jam & tanggal ----------
// ---------- Kalender Hijriah (hisab tabular, offline) ----------
const BULAN_HIJRIAH=["Muharram","Safar","Rabiul Awal","Rabiul Akhir","Jumadil Awal","Jumadil Akhir","Rajab","Syaban","Ramadhan","Syawal","Dzulqaidah","Dzulhijjah"];
function gregorianToJDN(y,m,d){
  const a=Math.floor((14-m)/12);
  const y2=y+4800-a;
  const m2=m+12*a-3;
  return d+Math.floor((153*m2+2)/5)+365*y2+Math.floor(y2/4)-Math.floor(y2/100)+Math.floor(y2/400)-32045;
}
function islamicToJDN(year,month,day){
  return day+Math.ceil(29.5*(month-1))+(year-1)*354+Math.floor((3+11*year)/30)+1948440-1;
}
function jdnToIslamic(jdn){
  let year=Math.floor((30*(jdn-1948440)+10646)/10631);
  let month=Math.min(12, Math.ceil((jdn-(29+islamicToJDN(year,1,1)))/29.5)+1);
  let day=jdn-islamicToJDN(year,month,1)+1;
  return {year,month,day};
}
function tampilkanTanggalHijriah(){
  const now=new Date();
  const jdn=gregorianToJDN(now.getFullYear(), now.getMonth()+1, now.getDate());
  const h=jdnToIslamic(jdn);
  const elH=document.getElementById('tglHijriah');
  if(elH) elH.textContent=h.day+' '+BULAN_HIJRIAH[h.month-1]+' '+h.year+' H';

  const banner=document.getElementById('bannerHari');
  if(banner){
    if(h.month===9){
      banner.style.display='block';
      banner.textContent='🌙 Bulan Ramadhan '+h.year+' H — Hari ke-'+h.day;
    } else if(h.month===10 && h.day===1){
      banner.style.display='block';
      banner.textContent='🎉 Selamat Idul Fitri '+h.year+' H, Mohon Maaf Lahir dan Batin';
    } else if(h.month===12 && h.day===10){
      banner.style.display='block';
      banner.textContent='🕌 Selamat Hari Raya Idul Adha '+h.year+' H';
    } else {
      banner.style.display='none';
    }
  }

  renderInfoIslami(h, jdn);
}

function jdnToGregorian(jdn){
  const a=jdn+32044;
  const b=Math.floor((4*a+3)/146097);
  const c=a-Math.floor((146097*b)/4);
  const d=Math.floor((4*c+3)/1461);
  const e=c-Math.floor((1461*d)/4);
  const m=Math.floor((5*e+2)/153);
  const day=e-Math.floor((153*m+2)/5)+1;
  const month=m+3-12*Math.floor(m/10);
  const year=100*b+d-4800+Math.floor(m/10);
  return {year, month, day};
}
const BULAN_MASEHI=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];

function renderInfoIslami(h, jdn){
  const box=document.getElementById('infoIslami');
  if(!box) return;
  const items=[];

  const PENJELASAN={
    'Ramadhan':'Bulan ke-9 kalender Hijriah, bulan wajib berpuasa bagi umat Islam. Dihitung dengan hisab tabular (bukan rukyat/pengamatan hilal langsung), sehingga tanggal bisa berbeda ±1 hari dari pengumuman resmi pemerintah (Sidang Isbat).',
    'Idul Fitri':'Hari raya 1 Syawal, menandai berakhirnya bulan Ramadhan. Dihitung dengan hisab tabular, bisa berbeda ±1 hari dari pengumuman resmi pemerintah (Sidang Isbat).',
    'Idul Adha':'Hari raya 10 Dzulhijjah, bertepatan dengan puncak ibadah haji dan disunnahkan berkurban. Dihitung dengan hisab tabular, bisa berbeda ±1 hari dari penetapan resmi.'
  };

  function buatItem(label, targetJdn, statusText){
    const g=jdnToGregorian(targetJdn);
    const tanggal=g.day+' '+BULAN_MASEHI[g.month-1]+' '+g.year;
    return {label, tanggal, status:statusText, targetJdn};
  }

  if(h.month===9){
    items.push(buatItem('Ramadhan', jdn, 'Hari ke-'+h.day));

    const tahun=h.year + (h.month>9 ? 1 : 0);
    const target=islamicToJDN(tahun,9,1);
    items.push(buatItem('Ramadhan', target, (target-jdn)+' hari lagi'));
  }

  if(h.month===10 && h.day===1){
    items.push(buatItem('Idul Fitri', jdn, 'Hari ini!'));
  } else {
    const tahun=h.year + ((h.month>10 || (h.month===10 && h.day>1)) ? 1 : 0);
    const target=islamicToJDN(tahun,10,1);
    items.push(buatItem('Idul Fitri', target, (target-jdn)+' hari lagi'));

  if(h.month===12 && h.day===10){
    items.push(buatItem('Idul Adha', jdn, 'Hari ini!'));
  } else {
    const tahun=h.year + ((h.month===12 && h.day>10) ? 1 : 0);
    const target=islamicToJDN(tahun,12,10);
    items.push(buatItem('Idul Adha', target, (target-jdn)+' hari lagi'));

  box.innerHTML = items.map(it=>
    '<div class="pcard"><div class="pname">'+it.label+'</div>'+
    '<div style="font-size:0.95vw; color:var(--muted); margin:0.3vh 0;">'+it.tanggal+'</div>'+
    '<div class="ptime" style="font-size:1.3vw;">'+it.status+'</div></div>'
  ).join('');

  Array.from(box.children).forEach((el, i)=>{
    el.tabIndex=0;
    el.addEventListener('click', ()=> tampilkanDetailIslami(items[i].label, items[i].targetJdn, items[i].status, PENJELASAN[items[i].label]));
    el.addEventListener('keydown', (e)=>{
      if(e.key==='Enter' || e.key===' '){ e.preventDefault(); tampilkanDetailIslami(items[i].label, items[i].targetJdn, items[i].status, PENJELASAN[items[i].label]); }
    });
  });
}

// ---------- Perhitungan waktu shalat (metode astronomis, tanpa koneksi internet) ----------
const METHODS={
  kemenag:{fajr:20, isha:18},
  muhammadiyah:{fajr:18, isha:18},
  mwl:{fajr:18, isha:17},
  isna:{fajr:15, isha:15}
};
const dtr=d=>d*Math.PI/180, rtd=r=>r*180/Math.PI;
function fixAngle(a){ a=a-360*Math.floor(a/360); return a<0?a+360:a; }
function fixHour(h){ h=h-24*Math.floor(h/24); return h<0?h+24:h; }

function julian(y,m,d){
  if(m<=2){ y-=1; m+=12; }
  const A=Math.floor(y/100), B=2-A+Math.floor(A/4);
  return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524.5;
}
function sunPosition(jd){
  const D=jd-2451545.0;
  const g=fixAngle(357.529+0.98560028*D);
  const q=fixAngle(280.459+0.98564736*D);
  const L=fixAngle(q+1.915*Math.sin(dtr(g))+0.020*Math.sin(dtr(2*g)));
  const e=23.439-0.00000036*D;
  const dec=rtd(Math.asin(Math.sin(dtr(e))*Math.sin(dtr(L))));
  let RA=rtd(Math.atan2(Math.cos(dtr(e))*Math.sin(dtr(L)),Math.cos(dtr(L))))/15;
  RA=fixHour(RA);
  const eqt=q/15-RA;
  return {dec:dec, eqt:eqt};
}
function sunAngleTime(jd, angle, lat, lng, tz, dir){
  const {dec,eqt}=sunPosition(jd+ (12-0)/24 ); // noon approx first pass
  const noon=12-lng/15-eqt+tz;
  const num=-Math.sin(dtr(angle))-Math.sin(dtr(lat))*Math.sin(dtr(dec));
  const den=Math.cos(dtr(lat))*Math.cos(dtr(dec));
  const ratio=num/den;
  if(Math.abs(ratio)>1) return null;
  const t=rtd(Math.acos(ratio))/15;
  return noon + (dir==='ccw'?-t:t);
}
function asrTime(jd, lat, lng, tz, factor){
  const {dec,eqt}=sunPosition(jd+0.5);
  const noon=12-lng/15-eqt+tz;
  const a=rtd(Math.atan(1/(factor+Math.tan(dtr(Math.abs(lat-dec))))));
  const num=Math.sin(dtr(a))-Math.sin(dtr(lat))*Math.sin(dtr(dec));
  const den=Math.cos(dtr(lat))*Math.cos(dtr(dec));
  const t=rtd(Math.acos(num/den))/15;
  return noon+t;
}
function toHHMM(t){
  if(t===null||isNaN(t)) return '--:--';
  t=fixHour(t);
  const h=Math.floor(t); const m=Math.round((t-h)*60);
  const hh=(m===60? h+1:h), mm=(m===60?0:m);
  return String(fixHour(hh)).padStart(2,'0').slice(0,2)+':'+String(mm).padStart(2,'0');
}

let coords=null;
let timezoneOffset=-new Date().getTimezoneOffset()/60;

function hitungWaktu(lat,lng,methodKey){
  const m=METHODS[methodKey]||METHODS.kemenag;
  const now=new Date();
  const jd=julian(now.getFullYear(), now.getMonth()+1, now.getDate());
  const fajr=sunAngleTime(jd, m.fajr, lat, lng, timezoneOffset, 'ccw');
  const sunrise=sunAngleTime(jd, 0.833, lat, lng, timezoneOffset, 'ccw');
  const {eqt}=sunPosition(jd+0.5);
  const dzuhur=12-lng/15-eqt+timezoneOffset+ (2/60); // +2 menit ihtiyat
  const ashar=asrTime(jd, lat, lng, timezoneOffset, 1);
  const maghrib=sunAngleTime(jd, 0.833, lat, lng, timezoneOffset, 'cw');
  const isya=sunAngleTime(jd, m.isha, lat, lng, timezoneOffset, 'cw');
  return [
    {key:'subuh', nama:'Subuh', t:fajr},
    {key:'dzuhur', nama:'Dzuhur', t:dzuhur},
    {key:'ashar', nama:'Ashar', t:ashar},
    {key:'maghrib', nama:'Maghrib', t:maghrib},
    {key:'isya', nama:'Isya', t:isya},
  ];
}

let jadwalCache=[];
function hitungDanTampilkan(){
  if(!coords) return;

  if(elLabel) elLabel.textContent='Metode: '+(KETERANGAN_METODE[selMetode.value] || selMetode.value);

function timeToDate(t){
  const now=new Date();
  const h=Math.floor(fixHour(t)); const m=Math.round((fixHour(t)-h)*60);
  const d=new Date(now.getFullYear(), now.getMonth(), now.getDate(), h, m, 0);
  return d;
}

let lastNotified='';
function updateCountdown(){
  if(!jadwalCache.length) return;
  const now=new Date();
  let next=null, nextDate=null;
  for(const p of jadwalCache){
    if(p.t===null) continue;
    const d=timeToDate(p.t);
    if(d>now){ next=p; nextDate=d; break; }
  }
  if(!next){ // sudah lewat isya, ambil subuh besok
    next=jadwalCache[0];
    nextDate=timeToDate(next.t); nextDate.setDate(nextDate.getDate()+1);
  }
  document.getElementById('nextName').textContent=next.nama;
  const diff=Math.max(0, nextDate-now);
  const hh=String(Math.floor(diff/3600000)).padStart(2,'0');
  const mm=String(Math.floor((diff%3600000)/60000)).padStart(2,'0');
  const ss=String(Math.floor((diff%60000)/1000)).padStart(2,'0');
  document.getElementById('countdown').textContent=hh+':'+mm+':'+ss;

  document.querySelectorAll('.pcard').forEach(c=>c.classList.remove('active'));
  const el=document.getElementById('card-'+next.key);
  if(el) el.classList.add('active');

  if(diff<1000 && lastNotified!==next.key+now.toDateString()){
    lastNotified=next.key+now.toDateString();
    mainkan(next.key==='subuh' ? 'subuh' : 'lainnya');
  }
}
setInterval(updateCountdown,1000);

// ---------- Nama lokasi/wilayah (reverse geocoding, butuh internet; TV tanpa internet tetap tampil koordinat) ----------
async function ambilNamaLokasi(lat, lng){
  try{
    const res=await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client?latitude='+lat+'&longitude='+lng+'&localityLanguage=id');
    if(!res.ok) throw new Error('gagal ambil nama lokasi');
    const data=await res.json();
    const bagian=[];
    if(data.locality) bagian.push(data.locality);
    if(data.city && data.city!==data.locality) bagian.push(data.city);
    if(data.principalSubdivision) bagian.push(data.principalSubdivision);
    if(data.countryName) bagian.push(data.countryName);
    const nama=bagian.filter(Boolean).join(', ');
    if(nama){
      savePref('lokasiNama', nama);
      const info=document.getElementById('locInfo');
      info.textContent=nama;
      info.classList.add('ok');
    }
  }catch(e){
    // Tidak ada internet atau diblokir pratinjau — tetap tampilkan koordinat seperti sebelumnya, tidak masalah.
  }
}

// ---------- Nada & audio kustom per slot (subuh / lainnya) ----------
let actx=null;
function nadaCtx(){ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); return actx; }
function beep(freq, start, dur, type){
  const ctx=nadaCtx();
  const osc=ctx.createOscillator(); const gain=ctx.createGain();
  osc.type=type||'sine'; osc.frequency.value=freq;
  const vol=0.25*getVolume();
  gain.gain.setValueAtTime(0.0001, ctx.currentTime+start);
  gain.gain.exponentialRampToValueAtTime(Math.max(vol,0.0001), ctx.currentTime+start+0.05);
  gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime+start+dur);
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime+start); osc.stop(ctx.currentTime+start+dur+0.05);
}
function mainkanBeep(){
  beep(523,0,0.5); beep(523,0.6,0.5); beep(523,1.2,0.5);
}

// ---------- Kendali stop untuk pemutaran suara (tombol Tes jadi Stop) ----------
let audioAktifSekarang=null;
let tombolTesAktif=null;
function resetTombolTes(){
  if(tombolTesAktif){ tombolTesAktif.textContent='🔔 Tes'; tombolTesAktif=null; }
}
function hentikanSemuaAudio(){
  if(audioAktifSekarang){
    try{ audioAktifSekarang.pause(); audioAktifSekarang.currentTime=0; }catch(e){}
    audioAktifSekarang=null;
  }
  if(typeof Native!=='undefined' && typeof Native.hentikanTes==='function'){
    try{ Native.hentikanTes(); }catch(e){}
  }
  resetTombolTes();
}

const SLOTS={};
function setupSlot(slot, labelNama){
  const sel=document.getElementById('selNada-'+slot);
  const btnTest=document.getElementById('btnTest-'+slot);
  const btnUpload=document.getElementById('btnUpload-'+slot);
  const btnHapus=document.getElementById('btnHapus-'+slot);
  const fileInput=document.getElementById('fileAdzan-'+slot);
  const fileNameLabel=document.getElementById('fileNameLabel-'+slot);
  const state={ data: loadPref('customAdzan-'+slot+'-data', null), name: loadPref('customAdzan-'+slot+'-name','') };
  sel.value=loadPref('nada-'+slot,'bawaan');

  function refresh(){
    const adaFile = loadPref('customAdzan-'+slot+'-hasfile', null)==='true';
    if(adaFile){
      fileNameLabel.textContent='🎵 '+labelNama+': '+(loadPref('customAdzan-'+slot+'-name','') || 'audio kustom');
      btnHapus.style.display='inline-block';
    } else {
      fileNameLabel.textContent='';
      btnHapus.style.display='none';
      if(sel.value==='custom'){ sel.value='bawaan'; savePref('nada-'+slot,'bawaan'); }
    }
  }
  refresh();

  sel.addEventListener('change', ()=>{ savePref('nada-'+slot, sel.value); syncNative(); });
  btnUpload.addEventListener('click', ()=> fileInput.click());
  fileInput.addEventListener('change', (e)=>{
    const f=e.target.files && e.target.files[0];
    if(!f) return;
    if(f.size>3*1024*1024){
      document.getElementById('statusMsg').textContent='File terlalu besar (maks sekitar 3MB). Pilih audio yang lebih pendek.';
      return;
    }
    const hasNative = typeof Native!=='undefined' && typeof Native.simpanAudioBase64==='function';
    const reader=new FileReader();
    reader.onload=()=>{
      try{
        if(!hasNative){ savePref('customAdzan-'+slot+'-data', reader.result); state.data=reader.result; }
        savePref('customAdzan-'+slot+'-name', f.name);
        savePref('customAdzan-'+slot+'-hasfile', 'true');
        state.name=f.name;
        sel.value='custom'; savePref('nada-'+slot,'custom');
        refresh();
        if(hasNative){
          try{ Native.simpanAudioBase64(slot, reader.result, f.name); }catch(e){}
        }
        document.getElementById('statusMsg').textContent='Audio '+labelNama.toLowerCase()+' berhasil diunggah dan tersimpan di perangkat ini.';
      }catch(err){
        document.getElementById('statusMsg').textContent='Gagal menyimpan audio (penyimpanan perangkat mungkin penuh). Coba file yang lebih kecil.';
      }
    };
    reader.readAsDataURL(f);
  });
  btnHapus.addEventListener('click', ()=>{
    try{
      localStorage.removeItem('customAdzan-'+slot+'-data');
      localStorage.removeItem('customAdzan-'+slot+'-name');
      localStorage.removeItem('customAdzan-'+slot+'-hasfile');
    }catch(e){}
    state.data=null; state.name='';
    refresh();
    if(typeof Native!=='undefined' && typeof Native.hapusAudioNative==='function'){
      try{ Native.hapusAudioNative(slot); }catch(e){}
    }
    document.getElementById('statusMsg').textContent='Audio '+labelNama.toLowerCase()+' dihapus. Kembali ke nada bawaan.';
  });
  btnTest.addEventListener('click', ()=>{
    if(tombolTesAktif===btnTest){
      hentikanSemuaAudio();
    } else {
      hentikanSemuaAudio();
      tombolTesAktif=btnTest;
      btnTest.textContent='⏹️ Stop';
      mainkan(slot);
    }
  });
  if('Notification' in window && Notification.permission==='default'){
    btnTest.addEventListener('click', ()=>{ try{ Notification.requestPermission(); }catch(e){} }, {once:true});
  }

  SLOTS[slot]={ sel, state };
}
setupSlot('subuh','Suara Subuh');
setupSlot('lainnya','Suara Lainnya');
volSlider.addEventListener('input', syncNative);
syncNative();

function mainkan(slot){
  const { sel, state }=SLOTS[slot];
  const jenis=sel.value;
  if(jenis==='custom'){
    if(typeof Native!=='undefined' && typeof Native.mainkanTes==='function'){
      try{ Native.mainkanTes(slot); }catch(e){ mainkanBeep(); setTimeout(resetTombolTes,1800); }
    } else if(state.data){
      const audio=new Audio(state.data);
      audio.volume=getVolume();
      audio.onended=()=>{ if(audioAktifSekarang===audio) audioAktifSekarang=null; resetTombolTes(); };
      audioAktifSekarang=audio;
      audio.play().catch(()=>{ document.getElementById('statusMsg').textContent='Tidak bisa memutar audio kustom otomatis di browser ini.'; resetTombolTes(); });
    } else {
      mainkanBeep(); setTimeout(resetTombolTes,1800);
    }
  } else if(jenis==='adzan_biasa' || jenis==='adzan_fajr'){
    const audio=new Audio(jenis+'.mp3');
    audio.volume=getVolume();
    audio.onended=()=>{ if(audioAktifSekarang===audio) audioAktifSekarang=null; resetTombolTes(); };
    audioAktifSekarang=audio;
    audio.play().catch(()=>{ mainkanBeep(); setTimeout(resetTombolTes,1800); });
  } else {
    mainkanBeep();
    setTimeout(resetTombolTes,1800);
  }
  document.getElementById('statusMsg').textContent='🔔 Waktu shalat telah tiba — nada pengingat diputar.';
  if('Notification' in window && Notification.permission==='granted'){
    try{ new Notification('Waktu Shalat', {body:'Saatnya shalat.'}); }catch(e){}
  }
}
