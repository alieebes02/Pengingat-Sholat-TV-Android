name: Build Android Release APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build Release APK
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            gradle assembleRelease
          fi

      - name: Generate Keystore & Sign Release APK
        run: |
          keytool -genkey -v -keystore release.keystore -alias pengingatshalat -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=PengingatShalatTV, OU=Community, O=AlieEbes, L=Pekalongan, S=JawaTengah, C=ID"
          UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          BUILD_TOOLS=$(ls -d ${ANDROID_HOME}/build-tools/* | sort -V | tail -n 1)
          "${BUILD_TOOLS}/zipalign" -v -p 4 "$UNSIGNED_APK" app-release-aligned.apk
          "${BUILD_TOOLS}/apksigner" sign --ks release.keystore --ks-pass pass:android123 --key-pass pass:android123 --out Pengingat-Shalat-TV-Release.apk app-release-aligned.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pengingat-Shalat-TV-Release
          path: Pengingat-Shalat-TV-Release.apk
