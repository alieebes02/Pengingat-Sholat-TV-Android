name: Build Android Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Generate Keystore & Sign Release APK
        run: |
          APK_UNSIGNED=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          keytool -genkeypair -v -keystore release.jks -alias pengingat_shalat -keyalg RSA -keysize 2048 -validity 10000 -storepass android123 -keypass android123 -dname "CN=PengingatShalatTV, OU=Dev, O=AlieEbes, L=Pekalongan, S=JawaTengah, C=ID"
          ZIPALIGN=$(find $ANDROID_HOME/build-tools -name "zipalign" | sort -V | tail -n 1)
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name "apksigner" | sort -V | tail -n 1)
          $ZIPALIGN -f -v 4 "$APK_UNSIGNED" app-release-aligned.apk
          $APKSIGNER sign --ks release.jks --ks-key-alias pengingat_shalat --ks-pass pass:android123 --key-pass pass:android123 --out Pengingat-Shalat-TV-Release.apk app-release-aligned.apk

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: Pengingat-Shalat-TV-Release
          path: Pengingat-Shalat-TV-Release.apk
